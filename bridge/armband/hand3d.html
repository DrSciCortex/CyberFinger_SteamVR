<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: #0d0d0d; overflow: hidden; }
  #app { position: fixed; inset: 0; }
  canvas { display: block; }
  .hud { position: fixed; pointer-events: none; color: #e9e7df;
         font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
  #title { top: 18px; left: 20px; }
  #title .k { font-size: 13px; font-weight: 700; letter-spacing: .14em;
              text-transform: uppercase; color: #f4f2ec; }
  #title .s { font-size: 11px; color: #8b8880; margin-top: 3px; display:flex; gap:7px; align-items:center; }
  #dot { width: 9px; height: 9px; border-radius: 50%; background: #9085e9;
         box-shadow: 0 0 10px currentColor; display:inline-block; }
  #bars { left: 20px; top: 50%; transform: translateY(-50%);
          display: flex; flex-direction: column; gap: 12px; }
  .bar { display: flex; align-items: center; gap: 9px; }
  .bar .lab { width: 46px; font-size: 10px; letter-spacing: .08em; text-transform: uppercase;
              color: #a7a49b; text-align: right; }
  .bar .track { width: 90px; height: 7px; border-radius: 4px; background: #1e1e1c;
                overflow: hidden; }
  .bar .fill { height: 100%; width: 0%; border-radius: 4px; transition: width .05s linear; }
  #gesture { bottom: 34px; left: 0; right: 0; text-align: center; }
  #gesture .g { font-size: 34px; font-weight: 800; letter-spacing: .16em;
                text-transform: uppercase; color: #3987e5; text-shadow: 0 2px 24px rgba(57,135,229,.35); }
  #gesture .h { font-size: 11px; color: #6f6c65; margin-top: 6px; letter-spacing:.05em; }
  .num { font-variant-numeric: tabular-nums; }
</style>

<div id="app"></div>
<div class="hud" id="title">
  <div class="k">EMG Hand</div>
  <div class="s"><span id="dot"></span><span id="mode">demo — no device</span></div>
</div>
<div class="hud" id="dbg" style="top:76px; left:20px; font-size:12px; color:#d6d3cb; max-width:92%; line-height:1.6; background:rgba(0,0,0,.4); padding:7px 10px; border-radius:7px;"></div>
<div class="hud" id="bars"></div>
<div class="hud" id="gesture">
  <div class="g" id="gname">OPEN</div>
  <div class="h">drag to rotate · scroll to zoom</div>
</div>

        if (o.isSkinnedMesh && o.skeleton) skel = o.skeleton;
      });
      const boneList = skel ? skel.bones : [];
      boneNames = boneList.map(function (b) { return b.name; });
      const lc = boneNames.map(function (n) { return n.toLowerCase(); });
      const LEVELS = ["proximal", "intermediate", "distal"];
      let matched = 0;
      for (const f of FINGERS) {
        FINGER_BONES[f].forEach(function (nm, i) {
          if (!nm) return;
          let idx = boneNames.indexOf(nm);
          if (idx < 0) idx = lc.findIndex(function (n) { return n.indexOf(f) >= 0 && n.indexOf(LEVELS[i]) >= 0; });
          if (idx >= 0) { bones[nm] = boneList[idx]; rest[nm] = boneList[idx].quaternion.clone(); matched++; }
        });
      }
      // thumb metacarpal drives opposition (not in FINGER_BONES)
      let tmci = boneNames.indexOf("thumb-metacarpal");
      if (tmci < 0) tmci = lc.findIndex(function (n) { return n.indexOf("thumb") >= 0 && n.indexOf("metacarpal") >= 0; });
      if (tmci >= 0) { bones["thumb-metacarpal"] = boneList[tmci]; rest["thumb-metacarpal"] = boneList[tmci].quaternion.clone(); }
      // ---- RE-CHAIN the flat skeleton into real finger chains so rotations
      //      cascade (proximal -> intermediate -> distal). attach() preserves
      //      world transforms, so the bind pose (and skinning) stays valid. ----
      function chainBone(a, b) { if (bones[a] && bones[b]) bones[a].attach(bones[b]); }
      for (const ff of ["index", "middle", "ring", "pinky"]) {
        chainBone(ff + "-finger-phalanx-proximal", ff + "-finger-phalanx-intermediate");
        chainBone(ff + "-finger-phalanx-intermediate", ff + "-finger-phalanx-distal");
      }
      chainBone("thumb-metacarpal", "thumb-phalanx-proximal");
      chainBone("thumb-phalanx-proximal", "thumb-phalanx-distal");
      // capture REST quaternions AFTER re-chaining (local frames changed)
      for (const nm in bones) rest[nm] = bones[nm].quaternion.clone();
      matchedCount = matched;
      // diagnostic: is the finger a parent->child chain (cascades) or flat?
      const _im = bones["index-finger-phalanx-intermediate"];
      if (_im) { let p = _im, ch = []; while (p && ch.length < 5) { ch.push(p.name || "?"); p = p.parent; } HIER = ch.join(" < "); }
      console.log("SKELETON BONES (" + boneList.length + "):", boneNames.join(", "));
      console.log("INDEX-INTER PARENT CHAIN:", HIER);
      updateDbg(matched);
      const box = new THREE.Box3().setFromObject(rootM);
      const size = box.getSize(new THREE.Vector3());
      const center = box.getCenter(new THREE.Vector3());
      rootM.position.sub(center);
      const maxDim = Math.max(size.x, size.y, size.z) || 1;
      const holder = new THREE.Group();
      holder.scale.setScalar(MODEL_SCALE / maxDim);
      holder.rotation.set(MODEL_ROT.x, MODEL_ROT.y, MODEL_ROT.z);
      holder.position.set(MODEL_POS.x, MODEL_POS.y, MODEL_POS.z);
      holder.add(rootM);
      hand.remove(procGroup);       // swap the procedural rig out for the real mesh
      hand.add(holder);
      meshReady = true;
    }, undefined, function (err) {
      console.warn("hand mesh load failed — keeping procedural hand", err);
      if (dbgEl) dbgEl.textContent = "mesh load FAILED (no internet?) — using fallback hand";
    });
  }

  // ---- state / smoothing ----
  const cur = { thumb:0, index:0, middle:0, ring:0, pinky:0 };
  const tgt = { thumb:0, index:0, middle:0, ring:0, pinky:0 };
  let gestureName = "OPEN";

  // ---- HUD bars ----
  const barsEl = document.getElementById("bars");
  const fills = {};
  FINGERS.forEach(function (f) {
    const row = document.createElement("div"); row.className = "bar";
    row.innerHTML = '<span class="lab">' + f + '</span><span class="track">' +
      '<span class="fill" style="background:' + FCOL[f] + '"></span></span>';
    barsEl.appendChild(row);
    fills[f] = row.querySelector(".fill");
  });
  const gnameEl = document.getElementById("gname");
  const dotEl = document.getElementById("dot");
  const modeEl = document.getElementById("mode");

  // ---- hand orientation from the glove IMUs (hand_quat / wrist_quat in /pose) ----
  // Quats arrive as [w,x,y,z] (CyberFinger order). We drive the hand's rotation
  // RELATIVE to a neutral captured with the "c" key, so the sensor mounting offset
  // cancels out. When a wrist quat is present we show hand-relative-to-wrist (so
  // wrist bend is isolated from whole-arm motion). IMU_REMAP re-bases the sensor
  // axes onto the view — leave it identity, and if the hand turns about the wrong
  // axis we'll tune it together.
  let imuOk = false, imuHave = false, imuRefSet = false;
  const IMU_REMAP = new THREE.Quaternion();                 // axis re-map (cycle with "m")
  const IMU_REMAPS = (function () {                          // the 24 axis-aligned orientations
    const out = [], seen = new Set(), d = Math.PI / 2, rr = v => Math.round(v * 1000);
    for (let a = 0; a < 4; a++) for (let b = 0; b < 4; b++) for (let c = 0; c < 4; c++) {
      const q = new THREE.Quaternion().setFromEuler(new THREE.Euler(a * d, b * d, c * d, "XYZ"));
      const k = [rr(q.x), rr(q.y), rr(q.z), rr(q.w)].join(","),
            nk = [-rr(q.x), -rr(q.y), -rr(q.z), -rr(q.w)].join(",");
      if (seen.has(k) || seen.has(nk)) continue;
      seen.add(k); out.push(q);
    }
    return out;
  })();
  let imuRemapIdx = 0, imuInvert = false;
  const _iH = new THREE.Quaternion(), _iW = new THREE.Quaternion();
  const _iRel = new THREE.Quaternion(), _iRef = new THREE.Quaternion();
  const _iDisp = new THREE.Quaternion(), _iBase = new THREE.Quaternion(), _iRemapInv = new THREE.Quaternion();
  function _q4(a) { return new THREE.Quaternion(a[1], a[2], a[3], a[0]); }  // [w,x,y,z] -> (x,y,z,w)
  function setImuQuat(h, w) {
    _iH.copy(_q4(h));
    if (Array.isArray(w)) { _iW.copy(_q4(w)); _iRel.copy(_iW).invert().multiply(_iH); }
    else { _iRel.copy(_iH); }
    if (!imuRefSet) { _iRef.copy(_iRel); imuRefSet = true; }  // auto-neutral on first sample
    imuHave = true;
  }
  function recenterImu() { if (imuHave) _iRef.copy(_iRel); }

  // ---- live pose polling (falls back to demo when /pose is unavailable) ----
  let live = false, demoT = 0, demoIdx = 0;
  const demoSeq = ["open", "fist", "point", "pinch", "peace", "thumbs_up", "open"];
  function applyPose(p) { FINGERS.forEach(function (f) { tgt[f] = p[f] || 0; }); }
  applyPose(POSES.open);

  async function poll() {
    try {
      const r = await fetch("/pose", { cache: "no-store" });
      if (!r.ok) throw 0;
      const j = await r.json();
      if (!testMode) {
        // drive the hand from the recognized GESTURE NAME -> a crisp full pose
        // (the reliable signal), ignoring the muted per-finger flex numbers
        const g = (j.gesture || "").toLowerCase().replace(/[^a-z_]/g, "");
        if (POSES[g]) applyPose(POSES[g]);
        else if (j.fingers) applyPose(j.fingers);   // grip / continuous fallback
      }
      if (j.gesture) gestureName = String(j.gesture).toUpperCase();
      imuOk = !!j.imu_ok && Array.isArray(j.hand_quat);
      if (imuOk) setImuQuat(j.hand_quat, j.wrist_quat);
      live = true;
      dotEl.style.background = j.connected ? "#0ca30c" : "#fab219";
      modeEl.textContent = j.connected ? "live — armband" : "waiting for signal…";
    } catch (e) {
      live = false;                       // demo mode (e.g. static preview)
      dotEl.style.background = "#9085e9";
      modeEl.textContent = "demo — no device";
    }
  }
  poll(); setInterval(poll, 60);

  // ---- orbit (simple drag + wheel), auto-rotate when idle ----
  let yaw = -0.5, pitch = -0.12, drag = false, px = 0, py = 0, idle = 0;
  const el = renderer.domElement;
  el.style.touchAction = "none";
  el.addEventListener("pointerdown", function (e) { drag = true; px = e.clientX; py = e.clientY; idle = 0; el.setPointerCapture(e.pointerId); });
  el.addEventListener("pointerup", function () { drag = false; });
  el.addEventListener("pointermove", function (e) {
    if (!drag) return;
    yaw += (e.clientX - px) * 0.008; pitch += (e.clientY - py) * 0.008;
    pitch = Math.max(-1.2, Math.min(1.2, pitch)); px = e.clientX; py = e.clientY; idle = 0;
  });
  el.addEventListener("wheel", function (e) {
    e.preventDefault();
    camera.position.z = Math.max(8, Math.min(26, camera.position.z + e.deltaY * 0.012));
  }, { passive: false });

  // live rig-tuning keys (find the correct bend axis without a code change)
  addEventListener("keydown", function (e) {
    const k = e.key.toLowerCase();
    if (k === "x") BEND_AXIS.set(1, 0, 0);
    else if (k === "y") BEND_AXIS.set(0, 1, 0);
    else if (k === "z") BEND_AXIS.set(0, 0, 1);
    else if (k === "f") BEND_SIGN *= -1;
    else if (k === "t") testMode = !testMode;
    else if (k === "c") recenterImu();
    else if (k === "m") { imuRemapIdx = (imuRemapIdx + 1) % IMU_REMAPS.length; IMU_REMAP.copy(IMU_REMAPS[imuRemapIdx]); }
    else if (k === "k") imuInvert = !imuInvert;
    else return;
    updateDbg(matchedCount);
  });

  // ---- render loop ----
  const clock = new THREE.Clock();
  function tick() {
    const dt = Math.min(0.05, clock.getDelta());
    idle += dt;
    if (!live) { demoT += dt; if (demoT > 1.8) { demoT = 0; demoIdx = (demoIdx + 1) % demoSeq.length; applyPose(POSES[demoSeq[demoIdx]]); gestureName = demoSeq[demoIdx].toUpperCase(); } }
    if (!drag && !reduce && idle > 2.5 && !imuOk) yaw += dt * 0.25;   // gentle auto-rotate when idle (off while IMU drives)

    if (testMode) {   // authoritative open<->fist curl for tuning (ignores live data)
      testT += dt;
      const tv = Math.sin(testT * 2.2) * 0.5 + 0.5;
      FINGERS.forEach(function (f) { tgt[f] = tv; cur[f] = tv; });
      gestureName = "TEST-CURL";
    }
    const k = 1 - Math.pow(0.001, dt);   // smoothing toward target (~exp)
    FINGERS.forEach(function (f) {
      cur[f] += (tgt[f] - cur[f]) * k;
      fills[f].style.width = Math.round(cur[f] * 100) + "%";
      if (!meshReady) setFinger(fingers[f], cur[f]);
    });
    if (meshReady) driveMesh(cur);
    if (imuOk && imuHave) {
      // hand rotation since the neutral pose, re-based onto the view frame
      _iDisp.copy(_iRel).multiply(_iRef.clone().invert());
      if (imuInvert) _iDisp.invert();
      _iRemapInv.copy(IMU_REMAP).invert();
      _iDisp.premultiply(IMU_REMAP).multiply(_iRemapInv);
      _iBase.setFromEuler(new THREE.Euler(pitch, yaw, 0, "XYZ"));   // drag still orbits the view
      handRoot.quaternion.copy(_iBase).multiply(_iDisp);
    } else {
      handRoot.rotation.set(pitch, yaw, 0, "XYZ");
    }
    gnameEl.textContent = gestureName;
    // live diagnostic: the ACTUAL values driving the mesh this frame
    const _d = document.getElementById("dbg");
    if (_d) _d.innerHTML = "<b style='color:#3aa5ff'>v6-chain</b>  mesh:" + (meshReady ? "Y" : "N")
      + "  imu:" + (imuOk ? "Y" : "N") + " map:" + imuRemapIdx + (imuInvert ? "i" : "") + " (c=recenter  m=axis  k=flip)"
      + "  joints " + matchedCount + "/14  gesture: " + gestureName
      + "<br>curl → " + FINGERS.map(function (f) { return f.slice(0, 2).toUpperCase() + " " + cur[f].toFixed(2); }).join("   ")
      + "<br>hier: " + HIER;
    renderer.render(scene, camera);
    requestAnimationFrame(tick);
  }
  tick();

  addEventListener("resize", function () {
    camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(innerWidth, innerHeight);
  });
})();
</script>
